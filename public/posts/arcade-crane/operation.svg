<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="720" height="360" rx="10" fill="#ffffff"/>

  <!-- position labels -->
  <g fill="#9ca3af" font-size="15" text-anchor="middle">
    <text x="208" y="52">1</text>
    <text x="284" y="52">2</text>
    <text x="360" y="52">3</text>
    <text x="436" y="52">4</text>
    <text x="512" y="52">5</text>
  </g>

  <text x="80" y="101" fill="#6b7280" font-size="17" font-style="italic" text-anchor="middle">antes</text>
  <text x="80" y="267" fill="#6b7280" font-size="17" font-style="italic" text-anchor="middle">después</text>

  <!-- before row: 3 [5 2 1] 4 -->
  <g stroke-width="2">
    <rect x="176" y="64" width="64" height="64" rx="9" fill="#f4f4f5" stroke="#d4d4d8"/>
    <rect x="252" y="64" width="64" height="64" rx="9" fill="#e6f4ea" stroke="#34a853"/>
    <rect x="328" y="64" width="64" height="64" rx="9" fill="#e6f4ea" stroke="#34a853"/>
    <rect x="404" y="64" width="64" height="64" rx="9" fill="#e6f4ea" stroke="#34a853"/>
    <rect x="480" y="64" width="64" height="64" rx="9" fill="#f4f4f5" stroke="#d4d4d8"/>
  </g>
  <g fill="#18181b" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="208" y="106">3</text>
    <text x="284" y="106">5</text>
    <text x="360" y="106">2</text>
    <text x="436" y="106">1</text>
    <text x="512" y="106">4</text>
  </g>

  <text x="360" y="158" fill="#374151" font-size="16" text-anchor="middle">se agarra el bloque que empieza en i = 2</text>

  <!-- arrow -->
  <rect x="357" y="168" width="6" height="34" rx="3" fill="#9ca3af"/>
  <polygon points="349,202 371,202 360,216" fill="#9ca3af"/>

  <!-- after row: [5 2 1] 3 4 -->
  <g stroke-width="2">
    <rect x="176" y="230" width="64" height="64" rx="9" fill="#e6f4ea" stroke="#34a853"/>
    <rect x="252" y="230" width="64" height="64" rx="9" fill="#e6f4ea" stroke="#34a853"/>
    <rect x="328" y="230" width="64" height="64" rx="9" fill="#e6f4ea" stroke="#34a853"/>
    <rect x="404" y="230" width="64" height="64" rx="9" fill="#f4f4f5" stroke="#d4d4d8"/>
    <rect x="480" y="230" width="64" height="64" rx="9" fill="#f4f4f5" stroke="#d4d4d8"/>
  </g>
  <g fill="#18181b" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="208" y="272">5</text>
    <text x="284" y="272">2</text>
    <text x="360" y="272">1</text>
    <text x="436" y="272">3</text>
    <text x="512" y="272">4</text>
  </g>

  <text x="360" y="330" fill="#374151" font-size="16" text-anchor="middle">el bloque se reinserta y queda en las posiciones 1, 2 y 3 (j = 1)</text>
</svg>
